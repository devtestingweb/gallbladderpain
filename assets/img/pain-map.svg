<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="t d">
<title id="t">Where gallbladder pain is felt</title>
<desc id="d">Front view: pain under the ribs on the right side and in the middle of the upper tummy. Back view: pain can spread to the right shoulder blade.</desc>
<defs>
  <radialGradient id="hot"><stop offset="0" stop-color="#e53935" stop-opacity=".9"/><stop offset=".45" stop-color="#ef5350" stop-opacity=".55"/><stop offset="1" stop-color="#ef5350" stop-opacity="0"/></radialGradient>
  <radialGradient id="warm"><stop offset="0" stop-color="#fb8c00" stop-opacity=".75"/><stop offset="1" stop-color="#fb8c00" stop-opacity="0"/></radialGradient>
  <path id="body" d="M-16 76 L-16 90 C-50 94 -78 100 -86 120 L-94 206 C-95 222 -81 223 -79 206 L-72 146 L-66 156 C-62 214 -66 262 -64 330 L64 330 C66 262 62 214 66 156 L72 146 L79 206 C81 223 95 222 94 206 L86 120 C78 100 50 94 16 90 L16 76 Z"/>
</defs>
<rect width="640" height="380" fill="#ffffff"/>
<g transform="translate(210 0)">
  <circle cx="0" cy="50" r="27" fill="#e6ecf4" stroke="#7b8ea8" stroke-width="2"/>
  <use href="#body" fill="#e6ecf4" stroke="#7b8ea8" stroke-width="2"/>
  <path d="M-52 156 Q0 120 52 156" fill="none" stroke="#9fb0c6" stroke-width="2" stroke-dasharray="5 5"/>
  <ellipse cx="-30" cy="176" rx="38" ry="32" fill="url(#hot)"/>
