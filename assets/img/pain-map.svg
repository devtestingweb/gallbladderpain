  <path d="M48 112 L16 108 L22 160 Z" fill="none" stroke="#9fb0c6" stroke-width="2" stroke-linejoin="round"/>
  <ellipse cx="32" cy="128" rx="34" ry="30" fill="url(#hot)"/>
  <text x="0" y="356" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0f2a4f">BACK</text>
  <text x="112" y="116" font-family="Arial, sans-serif" font-size="13" fill="#b3261e">Right</text>
  <text x="112" y="132" font-family="Arial, sans-serif" font-size="13" fill="#b3261e">shoulder</text>
  <text x="112" y="148" font-family="Arial, sans-serif" font-size="13" fill="#b3261e">blade</text>
  <line x1="108" y1="128" x2="64" y2="128" stroke="#b3261e" stroke-width="1.5"/>
