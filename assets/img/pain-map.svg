  <text x="0" y="356" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0f2a4f">FRONT</text>
  <text x="-112" y="186" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#b3261e">Right side,</text>
  <text x="-112" y="202" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#b3261e">under the ribs</text>
  <line x1="-108" y1="190" x2="-62" y2="180" stroke="#b3261e" stroke-width="1.5"/>
</g>
<g transform="translate(450 0)">
  <circle cx="0" cy="50" r="27" fill="#e6ecf4" stroke="#7b8ea8" stroke-width="2"/>
  <use href="#body" fill="#e6ecf4" stroke="#7b8ea8" stroke-width="2"/>
